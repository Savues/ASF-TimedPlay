name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: ./build.ps1

      # ASF's Windows release is a trimmed single-file build: ILLink drops every BCL member ASF itself never
      # calls, so a plugin that touches one compiles fine and only throws MissingMethodException at runtime.
      # Build a trimmed ASF and check the plugin against what actually survived.
      - name: Produce a trimmed ASF reference set
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/JustArchiNET/ArchiSteamFarm.git "${RUNNER_TEMP}/asf-src"
          dotnet publish "${RUNNER_TEMP}/asf-src/ArchiSteamFarm/ArchiSteamFarm.csproj" \
            -c Release -r win-x64 --self-contained true \
            -p:PublishTrimmed=true -p:PublishSingleFile=false \
            -o "${RUNNER_TEMP}/asf-trimmed"

      - name: Check the plugin against the trimmed BCL
        shell: pwsh
        run: ./check-trimming.ps1 -TrimmedDirectory "$env:RUNNER_TEMP/asf-trimmed"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/plugins/TimedPlay | Out-Null
          Copy-Item bin/Release/net10.0/TimedPlay.dll package/plugins/TimedPlay/
          if (Test-Path LICENSE) { Copy-Item LICENSE package/plugins/TimedPlay/ }
          if (Test-Path README.md) { Copy-Item README.md package/plugins/TimedPlay/ }
          Compress-Archive -Path package/plugins -DestinationPath TimedPlay.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimedPlay
          path: TimedPlay.zip
